[project]
name = "fantasy-basketball-assistant"
version = "0.1.0"
requires-python = "==3.13.7"
dependencies = [
    "numpy==2.3.5",
    "pydantic>=2.12,<3",
]

[project.scripts]
fba = "fba.apps.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fba"]

[dependency-groups]
dev = [
    "basedpyright",
    "deptry",
    "hypothesis",
    "pytest",
    "ruff",
    "scipy==1.18.1",
    "vulture",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.deptry]
known_first_party = ["fba"]
