<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>季賽助手</title><link rel="stylesheet" href="/style.css"></head>
<body>
<a id="skipLink" class="skip-link" href="#content">跳到主要內容</a>
<header class="app-header"><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="M3 20h34M20 3v34M8 8c16 4 20 12 24 24M32 8C16 12 12 20 8 32"/></svg><div><strong>FANTASY</strong><span>BASKETBALL ASSISTANT</span></div></div><div class="header-actions"><span id="freshness" class="muted"></span><button id="syncButton">同步資料</button><details class="app-menu"><summary aria-label="應用程式選單">更多</summary><button id="quitButton" class="quiet">結束助手</button><p class="muted">關閉分頁後仍會排程同步。</p></details></div></header>
<div class="app-layout"><aside class="sidebar"><p class="eyebrow">賽季助手</p><p id="leagueName" class="league-name">準備你的聯盟</p><nav aria-label="季賽功能" id="navigation"></nav><div class="sidebar-note"><span class="status-dot"></span> 本機工作區<p>每個決策，都回到你的球隊。</p></div></aside><div class="workspace-main">
<div id="notice" role="status" hidden></div><div id="error" role="alert" hidden></div>
<div id="busy" role="status" aria-live="polite" hidden><label for="progress">正在處理</label><progress id="progress" max="1"></progress><span id="phase"></span></div>
<div class="page-heading"><div><p class="eyebrow" id="pageEyebrow">YOUR GAME PLAN</p><h1 id="pageTitle">準備你的球隊</h1></div><span class="season-tag">SEASON MODE</span></div>
<main id="content" tabindex="-1"><section><h2>正在載入本機助手…</h2></section></main>
<footer><span>Fantasy data provided by Yahoo Fantasy</span><span>排陣、加退與交易請在 Yahoo 完成。</span></footer>
</div></div>
<dialog id="dialog" aria-label="詳細資訊"><button id="closeDialog" class="dialog-close" aria-label="關閉詳細資訊">關閉 ×</button><div id="dialogContent"></div></dialog>
<script type="module" src="/app.js"></script>
</body></html>
