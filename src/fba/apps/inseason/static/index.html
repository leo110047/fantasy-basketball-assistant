<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>季賽助手</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><p class="eyebrow">FANTASY BASKETBALL · IN SEASON</p><h1>季賽助手</h1><p id="leagueName" class="muted">連結你的聯盟，開始準備本週對戰。</p></div><div class="header-actions"><span id="freshness" class="muted"></span><button id="syncButton">同步資料</button><button id="quitButton" class="quiet">結束助手</button></div></header>
<div id="notice" role="status" hidden></div><div id="error" role="alert" hidden></div>
<nav aria-label="季賽功能" id="navigation"></nav>
<div id="busy" hidden><label for="progress">正在計算</label><progress id="progress" max="1"></progress><span id="phase"></span></div>
<main id="content"><section><h2>正在載入本機助手…</h2></section></main>
<footer><span>Fantasy data provided by Yahoo Fantasy</span><span>所有操作請在 Yahoo 手動完成。</span><span>關閉分頁後仍會排程同步；請用「結束助手」關閉程式。</span></footer>
<dialog id="dialog"><div id="dialogContent"></div><button id="closeDialog">關閉</button></dialog>
<script type="module" src="/app.js"></script>
</body></html>
